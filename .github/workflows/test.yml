# Test: typechecks, unit tests and the Electron end-to-end suite.
#
# Trigger: every pull request and every push to main. One platform
# only (Ubuntu) — the app is cross-platform, but the test suite
# checks behaviour, not packaging; the release workflow already
# covers all three platforms on tags.
name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (renderer, main, plugins)
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build the production app
        run: npm run build
      - name: End-to-end tests
        run: xvfb-run -a npm run test:e2e
      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: tests/e2e/artifacts/
          if-no-files-found: ignore
