[package]
name = "quickboard"
version = "0.1.0"
edition = "2021"
description = "QuickBoard — a quick-reveal infinite whiteboard for creatives"
license = "MIT"

[dependencies]
gpui = "0.2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
ureq = "2"

[profile.release]
opt-level = 3

# Vendored patch for xattr 0.2.3, which does not build against current
# libc on Linux (it references libc::ENOATTR, removed upstream; Linux
# reports that case as ENODATA). See vendor/xattr/PATCH.md. Remove this
# entry if upstream ever ships a fixed release.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
