<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Bowerbird handle</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
      /* The tab itself: semi-transparent, rounded on the side that
         faces the app (right, when it sits on the app's left edge),
         flat on the screen-edge side. */
      button {
        width: 100%; height: 100%; padding: 0; border: 1px solid rgba(0, 0, 0, 0.1);
        border-left: none; border-radius: 0 10px 10px 0;
        background: rgba(255, 255, 255, 0.55);
        color: #86868b; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
      }
      button:hover { background: rgba(255, 255, 255, 0.8); color: #1d1d1f; }
      svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.15s ease; }
      button.collapsed svg { transform: rotate(180deg); }
    </style>
  </head>
  <body>
    <button id="handle" title="Hide the app" aria-label="Hide the app"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" /></svg></button>
    <script>
      const btn = document.getElementById('handle');
      btn.addEventListener('click', async () => {
        // toggleEdge returns true when the app is now hidden.
        const hidden = await window.bowerbird.toggleEdge().catch(() => false);
        btn.classList.toggle('collapsed', hidden);
        btn.title = hidden ? 'Bring the app back' : 'Hide the app';
        btn.setAttribute('aria-label', btn.title);
      });
    </script>
  </body>
</html>
