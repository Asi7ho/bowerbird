<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Bowerbird</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
      /* The peek: a card showing a small version of the board itself.
         Hovering it grows it slightly and shows the hint, so it is
         clear this corner is clickable to open the board again. */
      #peek {
        width: 100%; height: 100%; overflow: hidden; cursor: pointer;
        background: #fff; border: 1px solid rgba(0, 0, 0, 0.12); border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18), 0 2px 6px rgba(0, 0, 0, 0.1);
        transition: transform 0.15s ease, box-shadow 0.15s ease; position: relative;
      }
      #peek:hover { transform: scale(1.04); box-shadow: 0 12px 32px rgba(0, 0, 0, 0.22), 0 2px 8px rgba(0, 0, 0, 0.12); }
      #peek img { width: 100%; height: 100%; object-fit: cover; display: none; }
      #placeholder {
        width: 100%; height: 100%; display: flex; flex-direction: column; gap: 6px;
        align-items: flex-start; justify-content: center; padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; color: #1d1d1f;
      }
      #placeholder b { font-size: 15px; }
      #placeholder span { font-size: 12px; color: #86868b; }
      #hint {
        position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 12px;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
        font-size: 12px; color: #fff; background: linear-gradient(transparent, rgba(0, 0, 0, 0.55));
        opacity: 0; transition: opacity 0.15s ease;
      }
      #peek:hover #hint { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="peek" title="Click to open the board">
      <img id="shot" alt="" />
      <div id="placeholder"><b>Bowerbird</b><span>Click to open the board</span></div>
      <div id="hint">Click to open</div>
    </div>
    <script>
      window.bowerbird.peekImage().then((url) => {
        if (!url) return;
        const img = document.getElementById('shot');
        img.src = url;
        img.style.display = 'block';
        document.getElementById('placeholder').style.display = 'none';
      }).catch(() => undefined);
      document.getElementById('peek').addEventListener('click', () => {
        window.bowerbird.restore().catch(() => undefined);
      });
    </script>
  </body>
</html>
