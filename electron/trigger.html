<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Bowerbird corner</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
      /* Invisible on purpose: this window exists only to notice a
         hover in the corner. It shows nothing and takes no visible
         screen space. */
      #zone { width: 100%; height: 100%; background: transparent; }
    </style>
  </head>
  <body>
    <div id="zone"></div>
    <script>
      // Dwell: merely passing through the corner must not reveal
      // the board — only holding the cursor here does.
      let timer = null;
      const zone = document.getElementById('zone');
      zone.addEventListener('mouseenter', () => {
        if (timer) clearTimeout(timer);
        timer = setTimeout(() => { window.bowerbird.reveal().catch(() => undefined); }, 400);
      });
      zone.addEventListener('mouseleave', () => {
        if (timer) { clearTimeout(timer); timer = null; }
      });
    </script>
  </body>
</html>
