<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bowerbird</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="main-column">
    <div id="title-bar">
      <div id="title-bar-left">
        <div id="window-controls" aria-label="Window controls">
          <button id="win-close" class="win-close" title="Close" aria-label="Close"><svg class="icon-mac" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 2l6 6M8 2L2 8" /></svg><svg class="icon-os" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" /></svg></button>
          <button id="win-minimise" class="win-minimise" title="Minimise" aria-label="Minimise"><svg class="icon-mac" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 5h6" /></svg><svg class="icon-os" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13h10" /></svg></button>
          <button id="win-fullscreen" class="win-fullscreen" title="Full screen" aria-label="Full screen"><svg class="icon-enter" viewBox="0 0 10 10" aria-hidden="true"><path d="M2.5 7.5L7.5 2.5M5.5 2.5H7.5V4.5M4.5 7.5H2.5V5.5" /></svg><svg class="icon-exit" viewBox="0 0 10 10" aria-hidden="true"><path d="M2.5 2.5L7.5 7.5M5.5 7.5H7.5V5.5M4.5 2.5H2.5V4.5" /></svg></button>
          <button id="win-maximise" class="win-maximise" title="Maximise" aria-label="Maximise"><svg class="icon-maximise" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="10" height="10" /></svg><svg class="icon-restore" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3h7v7H6z" /><path d="M3 6h7v7H3z" fill="#fff" /></svg></button>
        </div>
        <span id="title-bar-name">Bowerbird</span>
        <div id="title-bar-undo">
          <button id="btn-undo" title="Undo (Ctrl / Cmd + Z)" aria-label="Undo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5 3.5 8.5 7 12" /><path d="M3.5 8.5H13a5.5 5.5 0 0 1 0 11H10" /></svg></button>
          <button id="btn-redo" title="Redo (Ctrl / Cmd + Shift + Z)" aria-label="Redo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 5l3.5 3.5L17 12" /><path d="M20.5 8.5H11a5.5 5.5 0 0 0 0 11h3" /></svg></button>
        </div>
      </div>
      <div id="search-box">
        <input id="search-input" type="text" placeholder="Search text, color, image, audio, video…" aria-label="Search board" autocomplete="off" spellcheck="false" />
        <span id="search-count" aria-live="polite"></span>
        <button id="search-clear" title="Clear search (Esc)" aria-label="Clear search">×</button>
        <div id="search-results" style="display:none"></div>
      </div>
      <div id="title-bar-actions">
        <button id="panels-toggle" title="Show or hide plugin panels" aria-label="Show or hide plugin panels"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M15 4v16" /></svg></button>
      </div>
    </div>
    <div id="board">
      <div id="grid"></div>
      <svg id="canvas-svg"><g id="world"></g></svg>
      <div id="cards"></div>
      <div id="plugin-view" style="display:none"></div>
      <div id="plugin-overlays"></div>
      <div id="view-switcher" style="display:none"></div>
      <div id="resize-handle" aria-hidden="true"></div>
      <div id="rotate-handle" aria-hidden="true"></div>
      <div id="toolbar-wrap">
        <div id="toolbar">
          <div class="seg" id="tools">
            <button id="tool-select" title="Select (V)" aria-label="Select"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5 19 12l-7.5 1.4L8.6 20.5 6 3.5Z" /></svg></button>
            <button id="tool-pen" title="Pen (P)" aria-label="Pen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 19.5 5.6 15 16.2 4.4a2.12 2.12 0 0 1 3 3L8.6 18l-4.1 1.5Z" fill="none"/><path d="M14.5 6.5l3 3" /></svg></button>
            <button id="tool-connector" title="Arrow (A)" aria-label="Arrow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20 20 4" /><path d="M14 4h6v6" /></svg></button>
            <button id="tool-shape" title="Shape (R for rectangle, E for ellipse, more in the flyout)" aria-label="Shape"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2" /></svg></button>
          </div>
          <div class="palette" id="palette" style="display:none"></div>
          <div class="palette" id="shape-picker" style="display:none"></div>
          <div class="palette" id="note-colours" style="display:none"></div>
          <div class="divider"></div>
          <div class="zoom-group">
            <button id="zoom-out" title="Zoom out (-)" aria-label="Zoom out"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /></svg></button>
            <button id="zoom-in" title="Zoom in (+)" aria-label="Zoom in"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg></button>
          </div>
          <div class="divider"></div>
          <button id="btn-delete" title="Delete selection (Delete)" aria-label="Delete"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13" /><path d="M10 10.5v5M14 10.5v5" /></svg></button>
          <button id="btn-settings" title="Settings (?)" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h9M17 8h3M4 16h3M11 16h9" /><circle cx="15" cy="8" r="2.2" /><circle cx="9" cy="16" r="2.2" /></svg></button>
        </div>
      </div>
      <div id="settings-backdrop">
        <div id="settings">
          <div id="settings-header">
            <h2>Settings</h2>
            <button class="close" id="settings-close" title="Close (Esc)">×</button>
          </div>
          <div id="settings-layout">
            <div id="settings-tabs">
              <button data-settings-tab="general" class="active">General</button>
              <button data-settings-tab="plugins">Plugins</button>
              <button data-settings-tab="plugin-settings">Plugin settings</button>
            </div>
            <div id="settings-content">
              <div id="settings-section-general" class="settings-section">
                <h3>Keyboard shortcuts</h3>
                <table id="shortcuts-table"></table>
                <h3>Canvas</h3>
                <div class="canvas-opt" id="bg-opts"></div>
                <div class="canvas-opt" id="grid-opts"></div>
                <h3>Data</h3>
                <p class="meta" id="board-dir-meta"></p>
                <p class="meta" id="build-meta"></p>
                <button id="btn-reset">Delete all board data</button>
                <div id="reset-confirm" style="display:none">
                  <p class="meta">You can undo it with Ctrl / Cmd + Z.</p>
                  <button id="btn-reset-confirm">Delete everything</button>
                </div>
                <h3>Backups</h3>
                <div id="backups-list"></div>
                <h3>Send feedback</h3>
                <p class="meta">Opens in your email app, addressed to <span class="email">wren7762@gmail.com</span>.</p>
                <textarea id="feedback-text" rows="4" placeholder="What happened, or what would you like?"></textarea>
                <button id="btn-feedback">Send feedback</button>
              </div>
              <div id="settings-section-plugins" class="settings-section" style="display:none">
                <div id="plugin-list"></div>
              </div>
              <div id="settings-section-plugin-settings" class="settings-section" style="display:none">
                <div id="plugin-settings-sections"></div>
                <p class="meta" id="plugin-settings-empty" style="display:none">No plugin settings</p>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div id="toast"></div>
    </div>
    </div>
    <div id="plugin-panels"></div>
  </body>
</html>
